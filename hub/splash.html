<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlareVault</title>
<!--
  Placeholder splash for flarevault.dev.

  DELIBERATELY MINIMAL. FlareVault owns this page; when it can serve its own it
  replaces this file and nothing else changes. Anything clever here would have
  to be unpicked then.

  It says what this is and offers the one door. It does not list servers, name
  projects, or hint at what is behind the gate -- this page is public, and a
  public page that enumerates your infrastructure is a map for someone else.
-->
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#f78166;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#ffffff; --panel:#f6f8fa; --border:#d0d7de;
           --text:#1f2328; --muted:#656d76; --accent:#bc4c00; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{ width:100%; max-width:420px; }
  .mark{
    width:44px; height:44px; border-radius:10px; border:1px solid var(--border);
    background:var(--panel); display:flex; align-items:center; justify-content:center;
    font-size:20px; margin-bottom:22px;
  }
  h1{ font-size:22px; font-weight:500; margin:0 0 6px }
  p{ color:var(--muted); margin:0 0 26px; font-size:14px }
  a.enter{
    display:block; text-align:center; padding:11px 16px; border-radius:8px;
    border:1px solid var(--border); background:var(--panel);
    color:var(--text); text-decoration:none; font-size:14px;
  }
  a.enter:hover{ border-color:var(--accent); color:var(--accent) }
  .foot{
    margin-top:26px; padding-top:16px; border-top:1px solid var(--border);
    color:var(--muted); font-size:12px;
  }
  code{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">◆</div>
    <h1>FlareVault</h1>
    <p>Private infrastructure. Access is by invitation.</p>

    <a class="enter" href="/hub">Sign in</a>

    <div class="foot">
      Locked out? The hub is always reachable over Tailscale with a local
      login — that path never depends on this page, on Cloudflare, or on
      Google being up.
    </div>
  </main>
</body>
</html>
