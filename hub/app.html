// ── DRAG + RESIZE ─────────────────────────────────────────────────────────────
function makeDraggable(el, handle) {
  let ox, oy;
  handle.addEventListener('mousedown', e => {
    if (e.target.classList.contains('whb')) return;
    ox = e.clientX - el.offsetLeft;
    oy = e.clientY - el.offsetTop;
    const layer = document.getElementById('widget-layer');
    const lr = layer.getBoundingClientRect();
    const move = e2 => {
      const nx = Math.max(0, Math.min(e2.clientX - ox, lr.width - el.offsetWidth));
      const ny = Math.max(0, Math.min(e2.clientY - oy, lr.height - el.offsetHeight));
      el.style.left = nx + 'px'; el.style.top = ny + 'px';
    };
    const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
    e.preventDefault();
  });
}

function makeResizable(el, handle) {
  handle.addEventListener('mousedown', e => {
    const sx = e.clientX, sy = e.clientY, sw = el.offsetWidth, sh = el.offsetHeight;
    const move = e2 => {
      el.style.width  = Math.max(200, sw + e2.clientX - sx) + 'px';
      el.style.height = Math.max(120, sh + e2.clientY - sy) + 'px';
      const id = el.dataset.wid;
      const canvas = document.getElementById(`wcanvas-${id}`);
      if (canvas) resizeCanvas(id);
    };
    const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
    e.preventDefault();
  });
}

// ── WIDGET TERMINAL ───────────────────────────────────────────────────────────
async function runWTerm(id) {
  const inp = document.getElementById(`wtinp-${id}`); if (!inp) return;
  const cmd = inp.value.trim(); if (!cmd) return;
  inp.value = '';
  pushHistory(cmd);
  const out = document.getElementById(`wtout-${id}`); if (!out) return;
  out.innerHTML += `<span style="color:var(--teal)">$ ${cmd}\n</span>`;
  out.innerHTML += `<span style="color:var(--muted);font-style:italic">Running…\n</span>`;
  out.scrollTop = out.scrollHeight;
  try {
    const r = await fetch(API+'/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:cmd})});
    const d = await r.json();
    const lines = out.querySelectorAll('span');
    lines[lines.length-1].remove();
    if (d.output) out.innerHTML += `<span style="color:#c9d1d9">${d.output}\n</span>`;
    if (d.error)  out.innerHTML += `<span style="color:var(--red)">${d.error}\n</span>`;
  } catch { out.innerHTML += `<span style="color:var(--red)">Hub server not running\n</span>`; }
  out.scrollTop = out.scrollHeight;
}

// ── LOG TAIL WIDGET ───────────────────────────────────────────────────────────
async function tailLog(id) {
  const name = document.getElementById(`ltname-${id}`)?.value?.trim(); if (!name) return;
  const lines = document.getElementById(`ltlines-${id}`)?.value || '50';
  const out = document.getElementById(`ltout-${id}`); if (!out) return;
  out.textContent = `Fetching ${lines} lines from ${name}…`;
  try {
    const r = await fetch(API+'/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:`docker logs ${name} --tail ${lines} 2>&1`})});
    const d = await r.json();
    out.textContent = d.output || d.error || '(no output)';
    out.scrollTop = out.scrollHeight;
  } catch { out.textContent = 'Hub server not running.'; }
}

// ── CONTAINER TOGGLE WIDGET ───────────────────────────────────────────────────
function updateCtrToggleWidget(id) {
  const el = document.getElementById(`ctrtog-${id}`); if (!el) return;
  if (!S.containers.length) {
    el.innerHTML = `<div style="padding:12px 8px;font-size:11px;color:var(--muted)">No container data — connect server</div>`;
    return;
  }
  el.innerHTML = S.containers.map(c => `
    <div style="display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--border)">
      <span style="width:7px;height:7px;border-radius:50%;flex-shrink:0;background:${c.running?'var(--green)':'#444'}"></span>
      <span style="flex:1;font-size:10px;font-family:var(--mono);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${c.name}">${c.name}</span>
      <button onclick="toggleContainer('${c.name}',${c.running},'${id}')" style="background:${c.running?'rgba(248,81,73,.18)':'rgba(63,185,80,.15)'};color:${c.running?'var(--red)':'var(--green)'};border:none;border-radius:3px;padding:2px 7px;cursor:pointer;font-size:10px;font-weight:600;flex-shrink:0">${c.running?'Stop':'Start'}</button>
    </div>`).join('');
}

async function toggleContainer(name, isRunning, wid) {
  const cmd = isRunning ? `docker stop ${name}` : `docker start ${name}`;
  try {
    await fetch(API+'/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:cmd})});
    setTimeout(async () => {
      await refresh(true);
      W.widgets.filter(w=>w.type==='ctrtoggle').forEach(w=>updateCtrToggleWidget(w.id));
      if (wpTab==='alerts') renderAlertsTab();
    }, 1500);
  } catch {}
}

// ── TIMER WIDGET ──────────────────────────────────────────────────────────────
function timerFmt(sec) {
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return h ? `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
           : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function timerToggle(id) {
  const meta = W.widgets.find(w=>w.id===id); if (!meta) return;
  const st = meta.timerState;
  const disp = document.getElementById(`tdisp-${id}`);
  const btn  = document.getElementById(`tbtn-${id}`);
  if (st.running) {
    clearInterval(st.interval); st.running=false;
    if (btn) { btn.textContent='Start'; btn.style.background='var(--accent)'; btn.style.color='#000'; }
  } else {
    st.running=true;
    if (btn) { btn.textContent='Pause'; btn.style.background='var(--yellow)'; btn.style.color='#000'; }
    st.interval = setInterval(()=>{
      if (st.countdown !== null) {
        st.countdown = Math.max(0, st.countdown-1);
        if (disp) disp.textContent = timerFmt(st.countdown);
        if (st.countdown === 0) {
          clearInterval(st.interval); st.running=false;
          if (btn) { btn.textContent='Start'; btn.style.background='var(--accent)'; }
          if (disp) disp.style.color='var(--red)';
        }
      } else {
        st.elapsed++;
        if (disp) disp.textContent = timerFmt(st.elapsed);
      }
    }, 1000);
  }
}
function timerReset(id) {
  const meta = W.widgets.find(w=>w.id===id); if (!meta) return;
  const st = meta.timerState;
  clearInterval(st.interval); st.running=false; st.elapsed=0; st.countdown=null;
  const disp=document.getElementById(`tdisp-${id}`);
  const btn=document.getElementById(`tbtn-${id}`);
  if (disp) { disp.textContent='00:00'; disp.style.color='var(--text)'; }
  if (btn)  { btn.textContent='Start'; btn.style.background='var(--accent)'; btn.style.color='#000'; }
}
function timerSet(id, sec) {
  timerReset(id);
  const meta = W.widgets.find(w=>w.id===id); if (!meta) return;
  meta.timerState.countdown=sec;
  const disp=document.getElementById(`tdisp-${id}`);
  if (disp) { disp.textContent=timerFmt(sec); disp.style.color='var(--text)'; }
}

// ── WHITEBOARD ────────────────────────────────────────────────────────────────
const boards = {};

function initBoard(id) {
  const board = document.getElementById(`wboard-${id}`);
  const canvas = document.getElementById(`wcanvas-${id}`);
  if (!board || !canvas) return;
  boards[id] = { tool: 'draw', drawing: false, color: '#58a6ff', lw: 2 };
  resizeCanvas(id);
  const ctx = canvas.getContext('2d');
  const b = boards[id];
  canvas.addEventListener('mousedown', e => {
    b.drawing = true;
    const r = canvas.getBoundingClientRect();
    ctx.beginPath(); ctx.moveTo(e.clientX - r.left, e.clientY - r.top);
  });
  canvas.addEventListener('mousemove', e => {
    if (!b.drawing) return;
    const r = canvas.getBoundingClientRect();
    if (b.tool === 'erase') { ctx.clearRect(e.clientX - r.left - 10, e.clientY - r.top - 10, 20, 20); return; }
    ctx.lineTo(e.clientX - r.left, e.clientY - r.top);
    ctx.strokeStyle = b.color; ctx.lineWidth = b.lw; ctx.lineCap = 'round'; ctx.stroke();
  });
  canvas.addEventListener('mouseup', () => { b.drawing = false; });
  canvas.addEventListener('mouseleave', () => { b.drawing = false; });
  document.getElementById(`wcolor-${id}`)?.addEventListener('input', e => { boards[id].color = e.target.value; });
}

function resizeCanvas(id) {
  const board = document.getElementById(`wboard-${id}`);
  const canvas = document.getElementById(`wcanvas-${id}`);
  if (!board || !canvas) return;
  const imgData = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
  canvas.width = board.clientWidth; canvas.height = board.clientHeight;
  canvas.getContext('2d').putImageData(imgData, 0, 0);
}

function setWBTool(id, tool) {
  if (boards[id]) boards[id].tool = tool;
  document.getElementById(`wtool-draw-${id}`)?.classList.toggle('active', tool==='draw');
  document.getElementById(`wtool-erase-${id}`)?.classList.toggle('active', tool==='erase');
}

function clearBoard(id) {
  const canvas = document.getElementById(`wcanvas-${id}`); if (!canvas) return;
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  document.querySelectorAll(`#wboard-${id} .sticky`).forEach(s => s.remove());
}

function addSticky(boardId) {
  const board = document.getElementById(`wboard-${boardId}`); if (!board) return;
  const sid = wuid();
  const s = document.createElement('div');
  s.className = 'sticky';
  s.dataset.sid = sid;
  s.style.cssText = `left:${30 + Math.random()*80}px;top:${30 + Math.random()*80}px`;
  s.contentEditable = true;
  s.innerHTML = `<div class="sticky-del" onclick="this.parentElement.remove()">✕</div>📌 Note`;
  board.appendChild(s);
  makeDraggablePlain(s);
  s.focus();
}

function makeDraggablePlain(el) {
  let ox, oy, dragging = false;
  el.addEventListener('mousedown', e => {
    if (e.target.contentEditable === 'true' || e.target.classList.contains('sticky-del')) return;
    dragging = true; ox = e.clientX - el.offsetLeft; oy = e.clientY - el.offsetTop; e.preventDefault();
  });
  document.addEventListener('mousemove', e => { if (dragging) { el.style.left=(e.clientX-ox)+'px'; el.style.top=(e.clientY-oy)+'px'; } });
  document.addEventListener('mouseup', () => { dragging = false; });
}
