<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Server Hub</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; scrollbar-width: none; }
*::-webkit-scrollbar { display: none; }
:root {
  --bg:        #0d1117;
  --panel:     #161b22;
  --panel2:    #1c2128;
  --border:    #21262d;
  --border2:   #30363d;
  --text:      #e6edf3;
  --muted:     #7d8590;
  --muted2:    #4d5566;
  --accent:    #58a6ff;
  --acdim:     #1f3a5c;
  --green:     #3fb950;
  --gdim:      #0d2a12;
  --red:       #f85149;
  --rdim:      #3d1a1a;
  --yellow:    #d29922;
  --ydim:      #2d2008;
  --teal:      #39d0c4;
  --mono:      'Cascadia Code','Fira Code','JetBrains Mono',Consolas,monospace;
  --ui:        -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --r:         5px;
  --t:         .14s ease;
  --cat-w:     52px;
  --sec-w:     176px;
  --wpanel-w:  176px;
  --wdock-w:   52px;
  --top-h:     36px;
  --tab-h:     34px;
  --bk-h:      28px;
  --foot-h:    24px;
}
body { font-family:var(--ui); background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; font-size:13px; }

/* ── TOP BAR ────────────────────────────────────── */
#top { height:var(--top-h); background:var(--panel); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 10px; gap:12px; flex-shrink:0; font-size:11px; font-family:var(--mono); }
.brand { font-size:13px; font-weight:700; color:var(--accent); }
#sdot { width:7px; height:7px; border-radius:50%; background:var(--muted2); flex-shrink:0; transition:background .4s; }
#sdot.on { background:var(--green); box-shadow:0 0 5px var(--green); }
#sdot.off { background:var(--red); }
.chip { color:var(--muted); display:flex; gap:4px; white-space:nowrap; }
.chip span { color:var(--text); }
#top-r { margin-left:auto; display:flex; align-items:center; gap:8px; }
.tbtn { background:none; border:1px solid var(--border2); border-radius:var(--r); color:var(--muted); cursor:pointer; padding:2px 8px; font-size:11px; font-family:var(--mono); transition:border-color var(--t),color var(--t); }
.tbtn:hover { border-color:var(--accent); color:var(--text); }

/* ── WORKSPACE TAB BAR ──────────────────────────── */
#wsbar { height:var(--tab-h); background:var(--panel2); border-bottom:1px solid var(--border); display:flex; align-items:stretch; overflow-x:auto; overflow-y:hidden; flex-shrink:0; scrollbar-width:none; padding-left:calc(var(--cat-w) + var(--sec-w)); padding-right:calc(22px + var(--wdock-w)); }
#wsbar::-webkit-scrollbar { display:none; }

/* ── BOOKMARK BAR ───────────────────────────────── */
#bkbar { height:var(--bk-h); background:var(--panel); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 8px 0 calc(var(--cat-w) + 8px); gap:3px; flex-shrink:0; overflow-x:auto; scrollbar-width:none; }
#bkbar::-webkit-scrollbar { display:none; }
.bk-chip { display:flex; align-items:center; gap:4px; padding:2px 8px 2px 6px; border-radius:10px; background:var(--panel2); border:1px solid var(--border); font-size:10px; color:var(--muted); cursor:pointer; white-space:nowrap; flex-shrink:0; transition:border-color var(--t),color var(--t); }
.bk-chip:hover { border-color:var(--accent); color:var(--text); }
.bk-chip-x { color:var(--muted2); margin-left:2px; font-size:9px; }
.bk-chip-x:hover { color:var(--red); }
.bk-add { display:flex; align-items:center; gap:3px; padding:2px 7px; border-radius:10px; border:1px dashed var(--border2); font-size:10px; color:var(--muted2); cursor:pointer; white-space:nowrap; flex-shrink:0; transition:border-color var(--t),color var(--t); background:none; }
.bk-add:hover { border-color:var(--accent); color:var(--accent); }
.ws-tab { display:flex; align-items:center; gap:6px; padding:0 12px; font-size:12px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; flex-shrink:0; min-width:90px; max-width:160px; transition:color var(--t),background var(--t),border-color var(--t); user-select:none; }
.ws-tab:hover { color:var(--text); background:rgba(255,255,255,.04); }
.ws-tab.active { color:var(--text); border-bottom-color:var(--accent); background:var(--bg); }
.ws-tab-icon { font-size:13px; flex-shrink:0; }
.ws-tab-title { overflow:hidden; text-overflow:ellipsis; flex:1; }
.ws-tab-close { width:15px; height:15px; border-radius:3px; border:none; background:none; color:var(--muted2); cursor:pointer; font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background var(--t),color var(--t); }
.ws-tab-close:hover { background:var(--border2); color:var(--red); }
#ws-add { display:flex; align-items:center; padding:0 10px; color:var(--muted); cursor:pointer; font-size:16px; flex-shrink:0; border:none; background:none; transition:color var(--t); }
#ws-add:hover { color:var(--text); }

/* ── MAIN AREA ──────────────────────────────────── */
#main { flex:1; display:flex; overflow:hidden; }

/* ── CATEGORY NAV (far left) ────────────────────── */
#catnav { width:var(--cat-w); background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; align-items:center; padding:8px 0; gap:2px; flex-shrink:0; overflow-y:auto; scrollbar-width:none; }
#catnav::-webkit-scrollbar { display:none; }
.cat-item { width:40px; height:44px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:var(--r); cursor:pointer; color:var(--muted); transition:background var(--t),color var(--t); border:none; background:none; position:relative; }
.cat-item:hover { background:var(--panel2); color:var(--text); }
.cat-item.active { background:var(--acdim); color:var(--accent); }
.cat-item.active::after { content:''; position:absolute; left:0; top:50%; transform:translateY(-50%); width:3px; height:26px; background:var(--accent); border-radius:0 3px 3px 0; }
.cat-icon { font-size:18px; line-height:1; }
.cat-label { font-size:8px; font-weight:600; letter-spacing:.3px; text-transform:uppercase; }
.cat-sep { width:28px; height:1px; background:var(--border); margin:3px 0; flex-shrink:0; }

/* ── SECTION NAV scrollbar hidden ──────────────── */
#secnav-body { scrollbar-width:none; }
#secnav-body::-webkit-scrollbar { display:none; }

/* ── SECTION NAV (inner left) ───────────────────── */
#secnav { width:var(--sec-w); background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; transition:width var(--t); }
#secnav.collapsed { width:22px; }
#secnav.collapsed #secnav-title,
#secnav.collapsed #secnav-body { display:none; }
#secnav.collapsed #secnav-header { padding:8px 0; justify-content:center; align-items:flex-start; }
#secnav-header { padding:10px 12px 6px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
#secnav-title { font-size:10px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); }
#secnav-toggle { background:none; border:none; color:var(--muted2); cursor:pointer; font-size:13px; padding:2px 4px; transition:color var(--t); border-radius:3px; }
#secnav-toggle:hover { color:var(--text); background:var(--panel2); }
#secnav-body { flex:1; overflow-y:auto; padding:0 6px 8px; }
.sec-group { margin-bottom:10px; }
.sec-group-label { font-size:9px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--muted2); padding:6px 6px 4px; }
.sec-item { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:var(--r); cursor:pointer; font-size:12px; color:var(--muted); transition:background var(--t),color var(--t); }
.sec-item:hover { background:var(--panel2); color:var(--text); }
.sec-item.active { background:var(--panel2); color:var(--accent); }
.sec-item-icon { font-size:13px; flex-shrink:0; width:18px; text-align:center; }
.sec-item-badge { margin-left:auto; font-size:9px; font-weight:600; padding:1px 5px; border-radius:8px; }
.badge-up  { background:var(--gdim); color:var(--green); }
.badge-off { background:var(--panel); color:var(--muted); }
.badge-na  { background:var(--ydim); color:var(--yellow); }
.sec-add { display:flex; align-items:center; gap:6px; padding:5px 8px; border-radius:var(--r); cursor:pointer; font-size:11px; color:var(--muted2); transition:color var(--t); border:none; background:none; width:100%; }
.sec-add:hover { color:var(--accent); }
.sec-star { background:none; border:none; color:var(--muted2); cursor:pointer; font-size:12px; padding:0 2px; margin-left:auto; flex-shrink:0; opacity:0; transition:opacity var(--t),color var(--t); line-height:1; }
.sec-item:hover .sec-star { opacity:1; }
.sec-star.fav { color:var(--yellow); opacity:1; }

/* ── RIGHT WIDGET PANEL (inner right, collapsible) ── */
#wpanel { width:var(--wpanel-w); background:var(--panel); border-left:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; transition:width var(--t); }
#wpanel.collapsed { width:22px; }
#wpanel.collapsed #wpanel-title, #wpanel.collapsed #wpanel-body, #wpanel.collapsed #wpanel-tabs { display:none; }
#wpanel.collapsed #wpanel-header { padding:8px 0; justify-content:center; align-items:flex-start; }
#wpanel-header { padding:6px 8px 0; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; border-bottom:1px solid var(--border); gap:4px; }
#wpanel-title { font-size:10px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); }
#wpanel-tabs { display:flex; gap:1px; padding-bottom:0; }
.wp-tab { background:none; border:none; border-bottom:2px solid transparent; color:var(--muted); font-size:10px; font-family:var(--ui); font-weight:600; padding:4px 8px 5px; cursor:pointer; letter-spacing:.3px; transition:all var(--t); white-space:nowrap; border-radius:3px 3px 0 0; }
.wp-tab:hover { color:var(--text); }
.wp-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
#wpanel-toggle { background:none; border:none; color:var(--muted2); cursor:pointer; font-size:13px; padding:2px 4px; transition:color var(--t); border-radius:3px; }
#wpanel-toggle:hover { color:var(--text); background:var(--panel2); }
#wpanel-body { flex:1; overflow-y:auto; scrollbar-width:none; padding:0 6px 8px; }
#wpanel-body::-webkit-scrollbar { display:none; }
.w-type-item { display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:var(--r); cursor:pointer; font-size:12px; color:var(--muted); transition:background var(--t),color var(--t); }
.w-type-item:hover { background:var(--panel2); color:var(--text); }
.w-active-section { margin-top:10px; }
.w-active-item { display:flex; align-items:center; gap:6px; padding:5px 8px; border-radius:var(--r); font-size:11px; color:var(--muted); background:var(--panel2); margin-bottom:3px; }
.w-active-item .wa-title { flex:1; }
.wa-btn { background:none; border:none; color:var(--muted2); cursor:pointer; font-size:10px; padding:1px 4px; border-radius:3px; }
.wa-btn:hover { background:var(--border2); color:var(--text); }

/* ── RIGHT WIDGET DOCK (far right, always visible) ── */
#wdock { width:var(--wdock-w); background:var(--panel); border-left:1px solid var(--border); display:flex; flex-direction:column; align-items:center; padding:8px 0; gap:2px; flex-shrink:0; overflow-y:auto; scrollbar-width:none; }
#wdock::-webkit-scrollbar { display:none; }
.wdock-item { width:40px; height:44px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:var(--r); cursor:pointer; color:var(--muted); transition:background var(--t),color var(--t); border:none; background:none; position:relative; }
.wdock-item:hover { background:var(--panel2); color:var(--text); }
.wdock-item.active { background:rgba(57,208,196,.1); color:var(--teal); }
.wdock-item.active::after { content:''; position:absolute; right:0; top:50%; transform:translateY(-50%); width:3px; height:26px; background:var(--teal); border-radius:3px 0 0 3px; }
.wdock-icon { font-size:18px; line-height:1; }
.wdock-label { font-size:7.5px; font-weight:600; letter-spacing:.3px; text-transform:uppercase; }
.wdock-sep { width:28px; height:1px; background:var(--border); margin:3px 0; flex-shrink:0; }

/* ── WIDGET LAYER (always on top of everything) ── */
#widget-layer { position:fixed; inset:0; pointer-events:none; z-index:100; overflow:hidden; }
.widget { position:absolute; pointer-events:all; background:var(--panel); border:1px solid var(--border2); border-radius:7px; box-shadow:0 12px 40px rgba(0,0,0,.7); display:flex; flex-direction:column; min-width:260px; min-height:180px; }
.widget.minimized .widget-body { display:none; }
.widget-hdr { height:28px; background:var(--panel2); border-bottom:1px solid var(--border); border-radius:7px 7px 0 0; display:flex; align-items:center; padding:0 6px 0 10px; cursor:grab; gap:6px; user-select:none; flex-shrink:0; }
.widget-hdr:active { cursor:grabbing; }
.widget-hdr-title { flex:1; font-size:11px; font-weight:600; color:var(--muted); }
.widget-hdr-btns { display:flex; gap:2px; }
.whb { width:14px; height:14px; border-radius:3px; border:none; background:none; color:var(--muted2); cursor:pointer; font-size:10px; display:flex; align-items:center; justify-content:center; }
.whb:hover { background:var(--border2); color:var(--text); }
.widget-body { flex:1; overflow:hidden; border-radius:0 0 7px 7px; position:relative; }
.widget-resize { position:absolute; bottom:0; right:0; width:12px; height:12px; cursor:se-resize; }
.widget-resize::after { content:''; position:absolute; bottom:2px; right:2px; width:6px; height:6px; border-right:2px solid var(--border2); border-bottom:2px solid var(--border2); }

/* Terminal widget */
.wterm-out { flex:1; background:#010409; padding:8px; font-family:var(--mono); font-size:10.5px; overflow-y:auto; white-space:pre-wrap; word-break:break-all; line-height:1.55; height:0; }
.wterm-row { display:flex; gap:4px; align-items:center; padding:4px 6px; background:var(--panel2); border-top:1px solid var(--border); flex-shrink:0; }
.wterm-inp { flex:1; background:var(--bg); border:1px solid var(--border); border-radius:3px; color:var(--text); font-family:var(--mono); font-size:10.5px; padding:3px 6px; }
.wterm-inp:focus { outline:none; border-color:var(--accent); }

/* Whiteboard widget */
.wboard { width:100%; height:100%; position:relative; overflow:hidden; cursor:crosshair; background:#0a0f16; }
.wboard canvas { position:absolute; inset:0; }
.sticky { position:absolute; width:130px; min-height:90px; background:#2a2408; border:1px solid #5a4a0a; border-radius:4px; padding:6px 8px; font-family:var(--ui); font-size:11px; color:#e6d080; cursor:move; user-select:none; resize:both; overflow:auto; line-height:1.5; box-shadow:2px 4px 12px rgba(0,0,0,.4); }
.sticky[contenteditable=true]:focus { outline:none; border-color:#d29922; }
.sticky-del { position:absolute; top:3px; right:4px; font-size:9px; color:#5a4a0a; cursor:pointer; line-height:1; }
.sticky-del:hover { color:var(--red); }
.wboard-toolbar { position:absolute; top:6px; left:6px; display:flex; gap:4px; z-index:5; }
.wbt { padding:3px 8px; border-radius:3px; border:1px solid var(--border2); background:rgba(22,27,34,.9); color:var(--muted); font-size:10px; cursor:pointer; }
.wbt:hover { color:var(--text); border-color:var(--accent); }
.wbt.active { color:var(--accent); border-color:var(--accent); background:var(--acdim); }
.wbt-color { width:20px; height:20px; border-radius:3px; border:2px solid var(--border2); cursor:pointer; }

/* Stats widget */
.wstats { padding:10px; display:flex; flex-direction:column; gap:8px; overflow-y:auto; height:100%; }
.stat-row { display:flex; flex-direction:column; gap:3px; }
.stat-label { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); display:flex; justify-content:space-between; }
.stat-bar { height:4px; background:var(--panel2); border-radius:2px; overflow:hidden; }
.stat-fill { height:100%; border-radius:2px; background:var(--accent); transition:width .4s; }
.stat-val { font-family:var(--mono); font-size:11px; color:var(--text); }

/* ── WORKSPACE AREA ─────────────────────────────── */
#wsarea { flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative; }
.workspace { flex:1; display:none; overflow:hidden; }
.workspace.active { display:flex; }

/* ── PANE GRID ──────────────────────────────────── */
.pane-grid { flex:1; display:grid; overflow:hidden; gap:2px; background:var(--border); }
.pane-grid.l1  { grid-template: 1fr / 1fr; }
.pane-grid.l2h { grid-template: 1fr / 1fr 1fr; }
.pane-grid.l2v { grid-template: 1fr 1fr / 1fr; }
.pane-grid.l4  { grid-template: 1fr 1fr / 1fr 1fr; }

/* ── PANE ───────────────────────────────────────── */
.pane { display:flex; flex-direction:column; background:var(--bg); overflow:hidden; }
.pane-bar { height:30px; background:var(--panel2); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 6px; gap:4px; flex-shrink:0; }
.pane-view-btn { background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; font-family:var(--ui); display:flex; align-items:center; gap:5px; padding:2px 6px; border-radius:3px; transition:background var(--t),color var(--t); }
.pane-view-btn:hover { background:var(--panel); color:var(--text); }
.pane-view-btn .pv-icon { font-size:13px; }
.pane-split-btns { margin-left:auto; display:flex; gap:2px; }
.psb { background:none; border:none; color:var(--muted2); cursor:pointer; font-size:11px; padding:2px 4px; border-radius:3px; transition:background var(--t),color var(--t); }
.psb:hover { background:var(--panel); color:var(--text); }
.pane-body { flex:1; overflow:hidden; position:relative; }

/* ── DESK MODE ──────────────────────────────────── */
#desk-overlay { display:none; position:fixed; inset:0; z-index:48;
  background-color:rgba(5,10,18,.9);
  background-image:radial-gradient(circle, rgba(88,166,255,.07) 1px, transparent 1px);
  background-size:24px 24px;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px); }
body.desk-mode #desk-overlay { display:block; }
body.desk-mode #widget-layer { z-index:60; }
#desk-exit { display:none; position:fixed; top:12px; right:16px; z-index:70;
  background:rgba(22,27,34,.95); border:1px solid var(--border2); border-radius:20px;
  color:var(--muted); font-size:11px; padding:5px 14px; cursor:pointer;
  font-family:var(--ui); transition:border-color var(--t),color var(--t); }
#desk-exit:hover { border-color:var(--accent); color:var(--text); }
body.desk-mode #desk-exit { display:flex; align-items:center; gap:6px; }
#desk-btn { display:flex; align-items:center; gap:5px; }

/* ── PANE PICKER MENU + POPUPS ──────────────────── */
#picker, #tab-ctx { display:none; position:fixed; z-index:200; background:var(--panel); border:1px solid var(--border2); border-radius:var(--r); box-shadow:0 8px 24px rgba(0,0,0,.5); width:210px; padding:6px; max-height:min(340px,calc(100vh - 80px)); overflow-y:auto; }
#picker.show, #tab-ctx.show { display:block; }
.pick-item { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:4px; cursor:pointer; font-size:12px; color:var(--muted); transition:background var(--t),color var(--t); }
.pick-item:hover { background:var(--panel2); color:var(--text); }
.pick-sep { height:1px; background:var(--border); margin:4px 0; }
.pick-section { font-size:9px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--muted2); padding:4px 10px 2px; }

/* ── VIEW CONTENTS ──────────────────────────────── */
/* Iframe */
.view-iframe { width:100%; height:100%; border:none; }
.iframe-err { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:10px; color:var(--muted); }
.iframe-err h3 { color:var(--text); }

/* Dashboard */
.view-dash { padding:14px; overflow-y:auto; height:100%; }
.grp-label { font-size:10px; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--muted); margin:12px 0 7px; }
.svc-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:6px; }
.svc-card { background:var(--panel); border:1px solid var(--border); border-radius:var(--r); padding:9px 11px; cursor:pointer; transition:border-color var(--t); position:relative; min-height:66px; }
.svc-card:hover { border-color:var(--accent); }
.svc-card.dim { opacity:.5; cursor:default; }
.svc-card.dim:hover { border-color:var(--border); }
.sc-name { font-size:12px; font-weight:600; }
.sc-desc { font-size:10px; color:var(--muted); margin-top:2px; }
.sc-port { font-family:var(--mono); font-size:9px; color:var(--muted2); margin-top:5px; }
.sc-status { position:absolute; top:7px; right:7px; }

/* Terminal */
.view-term { display:flex; flex-direction:column; height:100%; }
.term-out { flex:1; background:#010409; padding:10px; font-family:var(--mono); font-size:11.5px; overflow-y:auto; white-space:pre-wrap; word-break:break-all; line-height:1.6; }
.term-in-row { display:flex; gap:6px; align-items:center; padding:6px 8px; background:var(--panel); border-top:1px solid var(--border); flex-shrink:0; }
.term-prompt { font-family:var(--mono); font-size:11px; color:var(--teal); white-space:nowrap; }
.term-inp { flex:1; background:var(--panel2); border:1px solid var(--border2); border-radius:var(--r); color:var(--text); font-family:var(--mono); font-size:11.5px; padding:4px 8px; }
.term-inp:focus { outline:none; border-color:var(--accent); }
.qcmds { padding:5px 8px 6px; display:flex; flex-wrap:wrap; gap:4px; background:var(--panel); border-top:1px solid var(--border); flex-shrink:0; }
.qc { font-family:var(--mono); font-size:10px; padding:2px 7px; border:1px solid var(--border2); border-radius:var(--r); background:var(--panel2); color:var(--muted); cursor:pointer; }
.qc:hover { color:var(--text); border-color:var(--accent); }
.tl-cmd  { color:var(--teal); }
.tl-out  { color:#c9d1d9; }
.tl-err  { color:var(--red); }
.tl-info { color:var(--muted); font-style:italic; }

/* Logs */
.view-logs { display:flex; flex-direction:column; height:100%; }
.logs-bar { padding:6px 8px; border-bottom:1px solid var(--border); display:flex; gap:6px; background:var(--panel); flex-shrink:0; }
.log-inp { background:var(--panel2); border:1px solid var(--border2); border-radius:var(--r); color:var(--text); font-family:var(--mono); font-size:11px; padding:4px 8px; }
.log-inp:focus { outline:none; border-color:var(--accent); }
.log-out { flex:1; background:#010409; padding:10px; font-family:var(--mono); font-size:11px; overflow-y:auto; white-space:pre-wrap; word-break:break-all; line-height:1.5; color:#8ca; }

/* Docs */
.view-docs { display:flex; height:100%; overflow:hidden; }
.docs-sb { width:170px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border); overflow-y:auto; padding:6px 0; }
.doc-item { padding:6px 12px; font-size:11px; cursor:pointer; color:var(--muted); transition:background var(--t),color var(--t); border-left:2px solid transparent; }
.doc-item:hover { background:var(--panel2); color:var(--text); }
.doc-item.active { color:var(--accent); border-left-color:var(--accent); background:var(--panel2); }
.docs-content { flex:1; overflow-y:auto; padding:20px 24px; }
.docs-content h1 { font-size:20px; font-weight:700; margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid var(--border); }
.docs-content h2 { font-size:15px; font-weight:700; margin:18px 0 8px; }
.docs-content h3 { font-size:12px; font-weight:700; margin:14px 0 6px; color:var(--accent); }
.docs-content p { font-size:12px; color:#c9d1d9; line-height:1.7; margin-bottom:9px; }
.docs-content ul,.docs-content ol { padding-left:18px; margin-bottom:9px; }
.docs-content li { font-size:12px; color:#c9d1d9; line-height:1.7; margin-bottom:2px; }
.docs-content code { font-family:var(--mono); font-size:10.5px; background:var(--panel2); padding:1px 5px; border-radius:3px; color:var(--teal); }
.docs-content pre { background:#010409; border:1px solid var(--border); border-radius:var(--r); padding:10px; margin:8px 0; overflow-x:auto; }
.docs-content pre code { background:none; padding:0; color:#c9d1d9; font-size:11px; }
.docs-content blockquote { border-left:3px solid var(--border2); margin:8px 0; padding:5px 12px; color:var(--muted); background:var(--panel); border-radius:0 var(--r) var(--r) 0; }
.docs-content table { border-collapse:collapse; margin:8px 0; }
.docs-content th { background:var(--panel2); padding:6px 9px; font-size:10px; font-weight:700; text-align:left; border:1px solid var(--border); color:var(--muted); }
.docs-content td { padding:6px 9px; font-size:11px; border:1px solid var(--border); color:#c9d1d9; }

/* Runbooks */
.view-runbooks { display:flex; height:100%; overflow:hidden; }
.rb-list { width:200px; flex-shrink:0; border-right:1px solid var(--border); overflow-y:auto; padding:8px 6px; }
.rb-card { padding:8px 10px; border-radius:var(--r); cursor:pointer; margin-bottom:4px; border:1px solid transparent; transition:all var(--t); }
.rb-card:hover { background:var(--panel2); }
.rb-card.active { background:rgba(57,208,196,.08); border-color:var(--accent); }
.rb-card-title { font-size:11px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:5px; }
.rb-card-desc { font-size:10px; color:var(--muted); margin-top:2px; }
.rb-card-status { margin-left:auto; font-size:9px; font-family:var(--mono); }
.rb-detail { flex:1; overflow-y:auto; padding:0; display:flex; flex-direction:column; }
.rb-detail-hdr { padding:10px 14px 8px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; flex-shrink:0; }
.rb-detail-title { font-size:13px; font-weight:700; color:var(--text); }
.rb-detail-desc { font-size:11px; color:var(--muted); flex:1; }
.rb-steps { padding:8px 12px; flex:1; }
.rb-step { border:1px solid var(--border); border-radius:5px; margin-bottom:6px; overflow:hidden; }
.rb-step-hdr { display:flex; align-items:center; gap:8px; padding:8px 10px; cursor:pointer; background:var(--panel2); }
.rb-step-num { font-size:9px; font-family:var(--mono); color:var(--muted2); min-width:16px; }
.rb-step-name { font-size:11px; color:var(--text); font-weight:600; flex:1; }
.rb-step-cmd { font-size:9px; font-family:var(--mono); color:var(--muted); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px; }
.rb-step-icon { font-size:14px; flex-shrink:0; }
.rb-step-run { background:var(--accent); color:#000; border:none; border-radius:3px; padding:2px 9px; cursor:pointer; font-size:10px; font-weight:700; flex-shrink:0; }
.rb-step-run:disabled { opacity:.4; cursor:default; }
.rb-step-out { background:#010409; font-family:var(--mono); font-size:10px; line-height:1.6; padding:8px 10px; white-space:pre-wrap; word-break:break-all; color:#c9d1d9; display:none; max-height:160px; overflow-y:auto; }
.rb-step-out.show { display:block; }

/* Map */
.view-map { width:100%; height:100%; background:#010409; position:relative; overflow-y:auto; }
.map-header { display:flex; align-items:center; gap:10px; padding:10px 14px 6px; border-bottom:1px solid var(--border); flex-shrink:0; }
.map-section { padding:10px 12px 0; }
.map-group-label { font-size:9px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--muted2); padding:0 2px 6px; }
.map-group-cards { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.stack-card { border:1px solid; border-radius:5px; padding:8px 10px; min-width:120px; max-width:160px; cursor:pointer; transition:filter var(--t),transform var(--t); flex-shrink:0; }
.stack-card:hover { filter:brightness(1.25); transform:translateY(-1px); }
.stack-card.no-click { cursor:default; }
.stack-ctr { display:flex; align-items:center; gap:4px; padding:2px 0; }
.map-network { margin:8px 12px 12px; padding:5px 12px; border:1px dashed #1c2d44; border-radius:4px; font-size:10px; font-family:var(--mono); color:#1c3450; text-align:center; letter-spacing:.5px; }

/* Vault */
.view-vault { padding:14px; overflow-y:auto; height:100%; }
#vlock { max-width:320px; margin:30px auto; }
#vlock h2 { font-size:18px; font-weight:700; margin-bottom:5px; }
#vlock p { color:var(--muted); font-size:11px; margin-bottom:14px; }
.vi { width:100%; background:var(--panel); border:1px solid var(--border2); border-radius:var(--r); color:var(--text); font-size:12px; padding:7px 10px; margin-bottom:8px; }
.vi:focus { outline:none; border-color:var(--accent); }
#vbody { display:none; }
#ventries { display:flex; flex-direction:column; gap:7px; margin-top:12px; }
.ve { background:var(--panel); border:1px solid var(--border); border-radius:var(--r); padding:8px 11px; display:flex; align-items:center; gap:7px; }
.ve-info { flex:1; min-width:0; }
.ve-title { font-weight:600; font-size:12px; }
.ve-user  { font-size:10px; color:var(--muted); }
.ve-pw { font-family:var(--mono); font-size:10px; color:var(--muted); margin-top:2px; }
.ve-pw.show { color:var(--text); letter-spacing:0; }
.ve-acts { display:flex; gap:3px; }

/* Issues */
.view-issues { padding:14px; overflow-y:auto; height:100%; }
.iss-row { display:flex; gap:8px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--border); }
.iss-dot { width:7px; height:7px; border-radius:50%; margin-top:5px; flex-shrink:0; }
.iss-dot.open { background:var(--yellow); }
.iss-dot.resolved { background:var(--green); }
.iss-title { font-size:12px; font-weight:600; }
.iss-desc  { font-size:10px; color:var(--muted); margin-top:2px; }
.iss-res   { font-size:10px; color:var(--green); margin-top:2px; }
.iss-date  { font-size:9px; color:var(--muted2); margin-top:3px; font-family:var(--mono); }

/* Network */
.view-net { padding:14px; overflow-y:auto; height:100%; display:flex; flex-direction:column; gap:10px; }
.net-card { background:var(--panel); border:1px solid var(--border); border-radius:var(--r); padding:10px 12px; }
.net-card h4 { font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
.net-pre { font-family:var(--mono); font-size:10.5px; color:#c9d1d9; white-space:pre-wrap; word-break:break-all; }

/* Chat */
.view-chat { display:flex; flex-direction:column; height:100%; }
#chat-msgs { flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:9px; }
.msg { display:flex; flex-direction:column; max-width:85%; }
.msg.user { align-self:flex-end; align-items:flex-end; }
.msg.ai   { align-self:flex-start; }
.msg-bub { padding:8px 12px; border-radius:10px; font-size:12px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
.msg.user .msg-bub { background:var(--acdim); border:1px solid var(--accent); border-radius:10px 10px 2px 10px; }
.msg.ai   .msg-bub { background:var(--panel); border:1px solid var(--border); color:#c9d1d9; border-radius:10px 10px 10px 2px; font-family:var(--mono); font-size:11px; }
.msg-meta { font-size:9px; color:var(--muted2); margin-top:2px; }
#chat-row { padding:8px 10px; border-top:1px solid var(--border); display:flex; gap:6px; align-items:flex-end; background:var(--panel); flex-shrink:0; }
#chat-inp { flex:1; background:var(--panel2); border:1px solid var(--border2); border-radius:var(--r); color:var(--text); font-family:var(--ui); font-size:12px; padding:6px 10px; resize:none; min-height:32px; max-height:100px; line-height:1.5; }
#chat-inp:focus { outline:none; border-color:var(--accent); }

/* Shared */
.btn { padding:4px 10px; border-radius:var(--r); border:1px solid var(--border2); background:var(--panel2); color:var(--text); font-size:11px; cursor:pointer; font-family:var(--ui); transition:border-color var(--t); }
.btn:hover { border-color:var(--accent); }
.btn.p { background:var(--acdim); border-color:var(--accent); color:var(--accent); }
.btn.d { background:var(--rdim); border-color:var(--red); color:var(--red); }
.badge { display:inline-block; padding:1px 6px; border-radius:8px; font-size:9px; font-weight:600; }
.badge.up  { background:var(--gdim); color:var(--green); }
.badge.dn  { background:var(--rdim); color:var(--red); }
.badge.off { background:var(--panel2); color:var(--muted); }

/* Footer */
#foot { height:var(--foot-h); background:var(--panel); border-top:1px solid var(--border); display:flex; align-items:center; padding:0 12px; gap:14px; font-size:10px; color:var(--muted); flex-shrink:0; font-family:var(--mono); }
.fsep { color:var(--border2); }

/* Modal */
#moverlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:300; align-items:center; justify-content:center; padding:16px; }
#moverlay.show { display:flex; }
#modal { background:var(--panel); border:1px solid var(--border2); border-radius:7px; padding:18px; width:340px; max-width:min(340px,calc(100vw - 32px)); max-height:calc(100vh - 80px); overflow-y:auto; }
#modal h3 { font-size:14px; font-weight:700; margin-bottom:12px; }
.mf { margin-bottom:8px; }
.mf label { display:block; font-size:10px; color:var(--muted); margin-bottom:3px; }
.macts { display:flex; gap:6px; justify-content:flex-end; margin-top:12px; }

/* Scrollbar */
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="top">
  <span class="brand">⬡ HUB</span>
  <div id="sdot"></div>
  <span class="chip">up <span id="t-up">—</span></span>
  <span class="chip">RAM <span id="t-ram">—</span></span>
  <span class="chip">disk <span id="t-disk">—</span></span>
  <span class="chip">load <span id="t-load">—</span></span>
  <span class="chip">🐳 <span id="t-ct">—</span></span>
  <div id="top-r">
    <span style="color:var(--muted);font-family:var(--mono);font-size:10px" id="t-clock"></span>
    <button class="tbtn" onclick="hardRefresh()">↻ Refresh</button>
    <button class="tbtn" onclick="enterDeskMode()" title="Desk Mode — focus your widgets" id="desk-btn">⊡ Desk</button>
  </div>
</div>

<!-- DESK MODE OVERLAY -->
<div id="desk-overlay"></div>
<button id="desk-exit" onclick="exitDeskMode()">✕ Exit Desk</button>
<!-- WIDGET LAYER — fixed, always on top of everything -->
<div id="widget-layer"></div>

<!-- WORKSPACE TAB BAR -->

  <button id="ws-add" onclick="newWorkspace()" title="New workspace">＋</button>
</div>

<!-- BOOKMARK BAR -->
<div id="bkbar">
  <button class="bk-add" onclick="addBookmark()">＋ Bookmark</button>
</div>

<!-- MAIN AREA -->
<div id="main">

  <!-- CATEGORY NAV (far left) -->
  <nav id="catnav">
    <button class="cat-item active" data-cat="server" onclick="setCategory('server')" title="Server">
      <span class="cat-icon">🖥</span><span class="cat-label">Server</span>
    </button>
    <button class="cat-item" data-cat="services" onclick="setCategory('services')" title="Services">
      <span class="cat-icon">⚙</span><span class="cat-label">Svcs</span>
    </button>
    <div class="cat-sep"></div>
    <button class="cat-item" data-cat="docs" onclick="setCategory('docs')" title="Knowledge Base">
      <span class="cat-icon">📚</span><span class="cat-label">Docs</span>
    </button>
    <button class="cat-item" data-cat="ops" onclick="setCategory('ops')" title="Ops & Runbooks">
      <span class="cat-icon">▶</span><span class="cat-label">Ops</span>
    </button>
    <button class="cat-item" data-cat="tools" onclick="setCategory('tools')" title="Tools">
      <span class="cat-icon">🛠</span><span class="cat-label">Tools</span>
    </button>
    <div class="cat-sep"></div>
    <button class="cat-item" data-cat="vault" onclick="setCategory('vault')" title="Vault">
      <span class="cat-icon">🔐</span><span class="cat-label">Vault</span>
    </button>
    <div class="cat-sep"></div>
    <button class="cat-item" data-cat="favorites" onclick="setCategory('favorites')" title="Favorites">
      <span class="cat-icon">⭐</span><span class="cat-label">Favs</span>
    </button>

  <!-- SECTION NAV (inner left, changes per category) -->
  <div id="secnav">

      <span id="secnav-title">Server</span>
      <button id="secnav-toggle" onclick="toggleSecNav()" title="Hide panel">◂</button>
    </div>

  <!-- WORKSPACE AREA -->
  <div id="wsarea"></div>

  <div id="wpanel">
    <div id="wpanel-header">
      <div id="wpanel-tabs">
        <button class="wp-tab active" data-tab="ctx" onclick="setWPTab('ctx')">Ctx</button>
        <button class="wp-tab" data-tab="alerts" onclick="setWPTab('alerts')">⚠</button>

      <span class="wdock-icon">📌</span><span class="wdock-label">Note</span>

    <div class="wdock-sep"></div>
    <div class="wdock-item" onclick="spawnWidget('stats');setWDock('stats')" data-wtype="stats" title="Server stats">
      <span class="wdock-icon">📊</span><span class="wdock-label">Stats</span>
    </div>
    <div class="wdock-item" onclick="spawnWidget('logtail');setWDock('logtail')" data-wtype="logtail" title="Container log tail">
      <span class="wdock-icon">📋</span><span class="wdock-label">Logs</span>

</div>

<!-- FOOTER -->
<div id="foot">
  <span id="f-last">—</span>
  <span class="fsep">|</span>
  <span id="f-ct">—</span>
  <span class="fsep">|</span>
  <span id="f-iss">—</span>

</div>

<!-- TAB CONTEXT MENU -->

  <div id="modal">
    <h3>Add Service</h3>
    <div class="mf"><label>Name</label><input class="vi" id="m-name" placeholder="My Service"></div>
    <div class="mf"><label>Port</label><input class="vi" id="m-port" type="number" placeholder="8080"></div>
    <div class="mf"><label>Description</label><input class="vi" id="m-desc" placeholder="What it does"></div>

      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn p" onclick="addServiceFromModal()">Add</button>

<script>
'use strict';
const API = 'http://localhost:8765';
const SRV = '192.168.1.229';

// ── GLOBAL STATE ────────────────────────────────────────────────────────────
const S = {
  status: null,
  services: [],
  issues: [],
  containers: [],
  docs: [],
  activeCategory: 'server',
  secNavCollapsed: false,
  workspaces: [],        // [{id, title, icon, pinned, layout, panes}]
  activeWs: null,        // id of active workspace
  pickerTarget: null,    // {wsId, paneId}
  termHistories: {},     // wsId+paneId -> []
  termHistIdx: {},
  vaultData: null,
  vaultMP: null,
  docsLoaded: false,
  mapDrawn: false,
};

let _wsCounter = 0;
const uid = () => 'x' + (++_wsCounter);

// ── CLOCK ───────────────────────────────────────────────────────────────────
setInterval(() => {
  document.getElementById('t-clock').textContent =
    new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}, 1000);

// ── STATUS ───────────────────────────────────────────────────────────────────
async function fetchStatus(force=false) {
  try {
    const r = await fetch(API + '/api/status' + (force?'?force=1':''));
    S.status = await r.json();
    applyStatus();
  } catch { applyStatus(false); }
}
function applyStatus(ok) {
  const s = S.status;
  const dot = document.getElementById('sdot');
  if (!s?.online) { dot.className='off'; return; }
  dot.className='on';
  if (s.uptime)    document.getElementById('t-up').textContent = s.uptime;
  if (s.ram_used_mb && s.ram_total_mb) {
    const u = (s.ram_used_mb/1024).toFixed(1), t = (s.ram_total_mb/1024).toFixed(0);
    document.getElementById('t-ram').textContent = `${u}/${t}GB`;
  }
  if (s.disk_pct)  document.getElementById('t-disk').textContent = s.disk_used+'/'+s.disk_total;
  if (s.load)      document.getElementById('t-load').textContent = s.load;
  if (s.containers !== undefined) {
    document.getElementById('t-ct').textContent = s.containers;
    document.getElementById('f-ct').textContent = s.containers + ' containers';
  }

function setCategory(cat) {
  S.activeCategory = cat;
  document.querySelectorAll('.cat-item').forEach(el => el.classList.toggle('active', el.dataset.cat===cat));
  document.getElementById('secnav-title').textContent = CATEGORIES[cat]?.title || cat;
  if (cat === 'docs') fetchDocs();
  refreshCategoryNav();
}

function refreshCategoryNav() {
  const cat = S.activeCategory;
  const body = document.getElementById('secnav-body');
  let html = '';

  const starBtn = (icon, label, type, extra={}) => {
    const fav = isFav(label);
    const extraStr = JSON.stringify(extra).replace(/"/g,'&quot;');
    return `<button class="sec-star${fav?' fav':''}" title="${fav?'Remove favorite':'Add to favorites'}"
      onclick="event.stopPropagation();toggleFav('${icon}','${label.replace(/'/g,'\\\'').replace(/"/g,'&quot;')}','${type}','${extraStr}')">${fav?'★':'☆'}</button>`;
  };

  if (cat === 'favorites') {
    if (!bookmarks.length) {
      html = '<div style="padding:16px 10px;color:var(--muted);font-size:11px;line-height:1.7">No favorites yet.<br>Hover any item in the nav and click ☆ to star it.</div>';
    } else {
      html = '<div class="sec-group"><div class="sec-group-label">Starred</div>';
      bookmarks.forEach((bk, i) => {
        html += `<div class="sec-item" onclick="runBookmark(${JSON.stringify(bk).replace(/"/g,'&quot;')})">
          <span class="sec-item-icon">${bk.icon}</span>${bk.label}
          <button class="sec-star fav" onclick="event.stopPropagation();removeBookmark(${i})">★</button>
        </div>`;
      });
      html += '</div>';
    }

  } else if (cat === 'services') {
    const groups = {};
    S.services.forEach(s => { const g=s.group||'Other'; if(!groups[g]) groups[g]=[]; groups[g].push(s); });
    const ORDER = ['Infrastructure','Monitoring','Notifications','Tools','AI','Custom','Other'];
    const sorted = Object.keys(groups).sort((a,b)=>{const ai=ORDER.indexOf(a),bi=ORDER.indexOf(b);return(ai<0?99:ai)-(bi<0?99:bi);});
    sorted.forEach(g => {
      html += `<div class="sec-group"><div class="sec-group-label">${g}</div>`;
      groups[g].forEach(s => {
        const inst = s.installed!==false;
        const url = `${s.https?'https':'http'}://${SRV}:${s.port}`;
        const badge = !inst ? 'off' : s.running ? 'up' : s.noui ? 'na' : '';
        const badgeText = !inst ? 'N/A' : s.running ? 'up' : s.noui ? 'no UI' : '?';
        const extra = {port:s.port, url, viewType:'iframe'};
        html += `<div class="sec-item" onclick="${inst&&!s.noui?`openIframeWs('${s.name}',${s.port},'${url}')`:''}" title="${s.desc||''}">
          <span class="sec-item-icon">${s.https?'🔒':'🌐'}</span>
          ${s.name}
          ${badge?`<span class="sec-item-badge badge-${badge}">${badgeText}</span>`:''}
          ${inst&&!s.noui ? starBtn('🌐', s.name, 'iframe', extra) : ''}
        </div>`;
      });
      html += '</div>';
    });
    html += `<button class="sec-add" onclick="openModal()">＋ Add Service</button>`;

  } else if (cat === 'docs') {
    if (!S.docsLoaded) {
      html = '<div style="padding:12px;color:var(--muted);font-size:11px">Loading…</div>';
    } else if (!S.docs.length) {
      html = '<div style="padding:12px;color:var(--muted);font-size:11px">No guides found in guides/ folder</div>';
    } else {
      html = '<div class="sec-group"><div class="sec-group-label">Guides</div>';
      S.docs.forEach(d => {
        html += `<div class="sec-item" onclick="openDocWs('${d.file}','${d.title}')">
          <span class="sec-item-icon">📄</span>${d.title}
          ${starBtn('📄', d.title, 'doc', {file:d.file})}
        </div>`;
      });
      html += '</div>';
    }
  } else {
    const sections = CATEGORIES[cat]?.sections || [];
    sections.forEach(sec => {
      if (sec.label) html += `<div class="sec-group"><div class="sec-group-label">${sec.label}</div>`;
      else html += '<div class="sec-group">';
      sec.items.forEach((item, idx) => {
        html += `<div class="sec-item" onclick="catAction(${JSON.stringify(cat)},${JSON.stringify(sec.label)},${idx})">
          <span class="sec-item-icon">${item.icon}</span>${item.label}
          ${starBtn(item.icon, item.label, 'view', {viewType: item.label.toLowerCase().replace(/\s+/g,'')==='artificialchat'?'chat':item.label.toLowerCase().replace(/\s+/g,'').replace('inframap','map').replace('dashboard','dashboard')})}
        </div>`;
      });
      html += '</div>';
    });
  }

  body.innerHTML = html;
}

// Because inline onclick can't call closures, map category actions by index
function catAction(cat, sectionLabel, idx) {
  const cat_def = CATEGORIES[cat];
  if (!cat_def) return;
  const sec = cat_def.sections.find(s=>s.label===sectionLabel);
  if (sec && sec.items[idx]) sec.items[idx].action();
}

function toggleSecNav() {
  S.secNavCollapsed = !S.secNavCollapsed;
  document.getElementById('secnav').classList.toggle('collapsed', S.secNavCollapsed);

}

// ── WORKSPACE SYSTEM ──────────────────────────────────────────────────────────
function createWorkspace({ title, icon='⊞', pinned=false, viewType='dashboard', viewConfig={} } = {}) {
  const id = uid();
  const paneId = uid();
  const ws = {
    id, title: title||'New Workspace', icon, pinned,
    layout: 'l1',
    panes: [{id: paneId, viewType, viewConfig}],
  };
  S.workspaces.push(ws);
  renderWsTab(ws);
  renderWorkspace(ws);
  activateWorkspace(id);
  return ws;
}

function openView(viewType, config={}) {
  // Reuse existing workspace with this view, or create new
  const existing = S.workspaces.find(ws => ws.panes.some(p=>p.viewType===viewType && !ws.panes.some(p=>p.viewType==='iframe')));
  if (existing) { activateWorkspace(existing.id); return; }
  const titles = { dashboard:'Dashboard', terminal:'Terminal', logs:'Logs', docs:'Docs', map:'Infra Map', vault:'Vault', issues:'Issues', network:'Network', chat:'AI Chat' };
  const icons  = { dashboard:'⊞', terminal:'⌨', logs:'📋', docs:'📚', map:'🗺', vault:'🔐', issues:'⚑', network:'🌐', chat:'🤖' };
  createWorkspace({ title: titles[viewType]||viewType, icon: icons[viewType]||'⊞', viewType, viewConfig: config });
}

function openIframeWs(name, port, url) {
  const id_key = 'iframe-' + port;
  const existing = S.workspaces.find(ws => ws.panes.some(p=>p.viewType==='iframe' && p.viewConfig.port===port));
  if (existing) { activateWorkspace(existing.id); return; }
  createWorkspace({ title: name, icon: '🌐', viewType: 'iframe', viewConfig: {url: `${API}/proxy/${port}/`, directUrl: url, port, title: name} });
}

function openDocWs(file, title) {
  const existing = S.workspaces.find(ws => ws.panes.some(p=>p.viewType==='docs' && p.viewConfig.file===file));
  if (existing) { activateWorkspace(existing.id); return; }
  createWorkspace({ title, icon: '📄', viewType: 'docs', viewConfig: {file} });
}

function newWorkspace() {
  createWorkspace({ title: 'New', icon: '○', viewType: 'blank' });
}

function activateWorkspace(id) {
  S.activeWs = id;
  document.querySelectorAll('.workspace').forEach(el => el.classList.toggle('active', el.dataset.ws===id));
  document.querySelectorAll('.ws-tab').forEach(el => el.classList.toggle('active', el.dataset.ws===id));
  // Trigger view-specific init
  const ws = S.workspaces.find(w=>w.id===id);
  if (ws) ws.panes.forEach(p => initPaneView(id, p.id, p.viewType, p.viewConfig));
  renderWPTabContent();
}

function closeWorkspace(id) {
  const ws = S.workspaces.find(w=>w.id===id);
  if (ws?.pinned) return;
  S.workspaces = S.workspaces.filter(w=>w.id!==id);
  document.querySelector(`.ws-tab[data-ws="${id}"]`)?.remove();
  document.querySelector(`.workspace[data-ws="${id}"]`)?.remove();
  if (S.activeWs === id) {
    const remaining = S.workspaces;
    if (remaining.length) activateWorkspace(remaining[remaining.length-1].id);
    else S.activeWs = null;
  }
}

function renderWsTab(ws) {
  const tab = document.createElement('div');
  tab.className = 'ws-tab';
  tab.dataset.ws = ws.id;
  tab.innerHTML = `<span class="ws-tab-icon">${ws.icon}</span>
    <span class="ws-tab-title">${ws.title}</span>
    ${!ws.pinned ? `<button class="ws-tab-close" onclick="event.stopPropagation();closeWorkspace('${ws.id}')">✕</button>` : ''}`;
  tab.addEventListener('click', () => activateWorkspace(ws.id));
  tab.addEventListener('contextmenu', e => { e.preventDefault(); openTabCtx(ws.id, e); });
  document.getElementById('ws-add').insertAdjacentElement('beforebegin', tab);
}

// ── PANE SYSTEM ───────────────────────────────────────────────────────────────
function renderWorkspace(ws) {
  const area = document.getElementById('wsarea');
  const el = document.createElement('div');
  el.className = 'workspace';
  el.dataset.ws = ws.id;
  el.innerHTML = renderPaneGrid(ws);
  area.appendChild(el);
  // Attach events
  el.querySelectorAll('[data-pane]').forEach(paneEl => {
    const paneId = paneEl.dataset.pane;
    const pane = ws.panes.find(p=>p.id===paneId);
    if (pane) mountPaneContent(ws.id, paneId, pane.viewType, pane.viewConfig, paneEl.querySelector('.pane-body'));
  });
}

function renderPaneGrid(ws) {
  return `<div class="pane-grid ${ws.layout}" data-ws-grid="${ws.id}">
    ${ws.panes.map(p => renderPane(ws.id, p)).join('')}
  </div>`;
}

function renderPane(wsId, pane) {
  const viewDef = VIEW_DEFS[pane.viewType] || VIEW_DEFS.blank;
  return `<div class="pane" data-pane="${pane.id}">
    <div class="pane-bar">
      <button class="pane-view-btn" onclick="openPicker('${wsId}','${pane.id}',this)">
        <span class="pv-icon">${viewDef.icon}</span>
        <span>${pane.viewConfig.title || viewDef.title}</span>
        <span style="color:var(--muted2);font-size:10px">▾</span>
      </button>
      <div class="pane-split-btns">
        <button class="psb" onclick="splitPane('${wsId}','${pane.id}','h')" title="Split right">⊢</button>
        <button class="psb" onclick="splitPane('${wsId}','${pane.id}','v')" title="Split down">⊤</button>
        <button class="psb" onclick="splitPane('${wsId}','${pane.id}','4')" title="Split 2×2">⊞</button>
        <button class="psb" onclick="closePane('${wsId}','${pane.id}')" title="Close pane" style="color:var(--muted2)">✕</button>
      </div>
    </div>
    <div class="pane-body"></div>
  </div>`;
}

const VIEW_DEFS = {
  dashboard: {icon:'⊞', title:'Dashboard'},
  terminal:  {icon:'⌨', title:'Terminal'},
  logs:      {icon:'📋', title:'Logs'},
  docs:      {icon:'📚', title:'Docs'},
  map:       {icon:'🗺', title:'Infra Map'},
  vault:     {icon:'🔐', title:'Vault'},
  issues:    {icon:'⚑',  title:'Issues'},
  network:   {icon:'🌐', title:'Network'},
  chat:      {icon:'🤖', title:'AI Chat'},
  runbooks:  {icon:'▶',  title:'Runbooks'},
  iframe:    {icon:'🔗', title:'Service'},
  blank:     {icon:'○',  title:'New Pane'},
};

function splitPane(wsId, paneId, dir) {
  const ws = S.workspaces.find(w=>w.id===wsId);
  if (!ws) return;
  if (dir === '4') {
    ws.panes = [{id:uid(),viewType:'dashboard',viewConfig:{}},{id:uid(),viewType:'terminal',viewConfig:{}},{id:uid(),viewType:'logs',viewConfig:{}},{id:uid(),viewType:'map',viewConfig:{}}];
    ws.layout = 'l4';
  } else if (dir === 'h') {
    if (ws.panes.length < 2) { ws.panes.push({id:uid(),viewType:'terminal',viewConfig:{}}); ws.layout='l2h'; }
    else if (ws.panes.length < 4) { ws.panes.push({id:uid(),viewType:'blank',viewConfig:{}}); ws.layout='l4'; }
  } else {
    if (ws.panes.length < 2) { ws.panes.push({id:uid(),viewType:'logs',viewConfig:{}}); ws.layout='l2v'; }
    else if (ws.panes.length < 4) { ws.panes.push({id:uid(),viewType:'blank',viewConfig:{}}); ws.layout='l4'; }
  }
  reRenderWorkspace(wsId);
}

function closePane(wsId, paneId) {
  const ws = S.workspaces.find(w=>w.id===wsId);
  if (!ws || ws.panes.length <= 1) return;
  ws.panes = ws.panes.filter(p=>p.id!==paneId);
  ws.layout = ws.panes.length===1?'l1':ws.panes.length===2?'l2h':'l4';
  reRenderWorkspace(wsId);
}

function reRenderWorkspace(wsId) {
  const ws = S.workspaces.find(w=>w.id===wsId);
  if (!ws) return;
  const el = document.querySelector(`.workspace[data-ws="${wsId}"]`);
  if (!el) return;
  el.innerHTML = renderPaneGrid(ws);
  el.querySelectorAll('[data-pane]').forEach(paneEl => {
    const paneId = paneEl.dataset.pane;
    const pane = ws.panes.find(p=>p.id===paneId);
    if (pane) mountPaneContent(wsId, paneId, pane.viewType, pane.viewConfig, paneEl.querySelector('.pane-body'));
  });
  if (S.activeWs === wsId) ws.panes.forEach(p => initPaneView(wsId, p.id, p.viewType, p.viewConfig));
}

// ── VIEW PICKER ───────────────────────────────────────────────────────────────
function openPicker(wsId, paneId, btn) {
  S.pickerTarget = {wsId, paneId};
  const picker = document.getElementById('picker');
  const viewList = Object.entries(VIEW_DEFS).filter(([k])=>k!=='blank').map(([k,v])=>
    `<div class="pick-item" onclick="setPaneView('${wsId}','${paneId}','${k}')">${v.icon} ${v.title}</div>`
  ).join('');
  const svcsHtml = S.services.filter(s=>s.installed!==false&&!s.noui).slice(0,8).map(s => {
    const url = `${s.https?'https':'http'}://${SRV}:${s.port}`;
    return `<div class="pick-item" onclick="setPaneView('${wsId}','${paneId}','iframe',{url:'${API}/proxy/${s.port}/',directUrl:'${url}',port:${s.port},title:'${s.name}'})">🌐 ${s.name}</div>`;
  }).join('');
  const otherWs = S.workspaces.filter(w=>w.id!==wsId);
  const wsHtml = otherWs.length ? otherWs.map(w =>
    `<div class="pick-item" onclick="setPaneFromWorkspace('${wsId}','${paneId}','${w.id}')">${w.icon} ${w.title}</div>`
  ).join('') : `<div class="pick-item" style="color:var(--muted2);cursor:default">No other workspaces open</div>`;
  picker.innerHTML = `
    <div class="pick-section">Views</div>${viewList}
    <div class="pick-sep"></div><div class="pick-section">Services</div>${svcsHtml}
    <div class="pick-sep"></div><div class="pick-section">Pull from open tab</div>${wsHtml}`;
  const rect = btn.getBoundingClientRect();
  picker.style.left = rect.left + 'px';
  picker.style.top  = (rect.bottom + 4) + 'px';
  picker.classList.add('show');
}

document.addEventListener('click', e => {
  const p = document.getElementById('picker');
  const c = document.getElementById('tab-ctx');
  if (!p.contains(e.target) && !e.target.classList.contains('pane-view-btn')) p.classList.remove('show');
  if (!c.contains(e.target)) c.classList.remove('show');
});

function setPaneFromWorkspace(wsId, paneId, sourceWsId) {
  document.getElementById('picker').classList.remove('show');
  const src = S.workspaces.find(w=>w.id===sourceWsId);
  if (!src || !src.panes[0]) return;
  const p = src.panes[0];
  setPaneView(wsId, paneId, p.viewType, {...p.viewConfig});
}

// ── TAB CONTEXT MENU ──────────────────────────────────────────────────────────
function openTabCtx(wsId, e) {
  const ws = S.workspaces.find(w=>w.id===wsId);
  if (!ws) return;
  const ctx = document.getElementById('tab-ctx');
  const canSplit = S.workspaces.filter(w=>w.id!==wsId);
  const splitItems = canSplit.map(o =>
    `<div class="pick-item" onclick="splitMerge('${wsId}','${o.id}')">⊢ ${o.icon} ${o.title}</div>`
  ).join('') || `<div class="pick-item" style="color:var(--muted2);cursor:default">No other tabs</div>`;
  ctx.innerHTML = `
    <div class="pick-section">${ws.icon} ${ws.title}</div>
    <div class="pick-item" onclick="splitPane('${wsId}','${ws.panes[0]?.id}','h')">⊢ Split right</div>
    <div class="pick-item" onclick="splitPane('${wsId}','${ws.panes[0]?.id}','v')">⊤ Split down</div>
    <div class="pick-item" onclick="splitPane('${wsId}','${ws.panes[0]?.id}','4')">⊞ Split 2×2</div>
    <div class="pick-sep"></div>
    <div class="pick-section">Group with…</div>
    ${splitItems}
    ${!ws.pinned ? `<div class="pick-sep"></div><div class="pick-item" onclick="closeWorkspace('${wsId}')" style="color:var(--red)">✕ Close</div>` : ''}`;
  ctx.style.left = Math.min(e.clientX, window.innerWidth - 210) + 'px';
  ctx.style.top  = Math.min(e.clientY, window.innerHeight - 200) + 'px';
  ctx.classList.add('show');
}

function splitMerge(wsId, addWsId) {
  document.getElementById('tab-ctx').classList.remove('show');
  const ws = S.workspaces.find(w=>w.id===wsId);
  const src = S.workspaces.find(w=>w.id===addWsId);
  if (!ws || !src || !src.panes[0]) return;
  const p = src.panes[0];
  if (ws.panes.length === 1) {
    ws.panes.push({id:uid(), viewType:p.viewType, viewConfig:{...p.viewConfig}});
    ws.layout = 'l2h';
  } else if (ws.panes.length === 2) {
    ws.panes.push({id:uid(), viewType:p.viewType, viewConfig:{...p.viewConfig}});
    ws.panes.push({id:uid(), viewType:'blank', viewConfig:{}});
    ws.layout = 'l4';
  }
  reRenderWorkspace(wsId);
  activateWorkspace(wsId);
}

function setPaneView(wsId, paneId, viewType, viewConfig={}) {
  document.getElementById('picker').classList.remove('show');
  const ws = S.workspaces.find(w=>w.id===wsId);
  if (!ws) return;
  const pane = ws.panes.find(p=>p.id===paneId);
  if (!pane) return;
  pane.viewType = viewType;
  pane.viewConfig = viewConfig;
  const paneEl = document.querySelector(`[data-pane="${paneId}"]`);
  if (!paneEl) return;
  const vdef = VIEW_DEFS[viewType]||VIEW_DEFS.blank;
  paneEl.querySelector('.pane-view-btn').innerHTML = `<span class="pv-icon">${vdef.icon}</span><span>${viewConfig.title||vdef.title}</span><span style="color:var(--muted2);font-size:10px">▾</span>`;

  initPaneView(wsId, paneId, viewType, viewConfig);
  if (wsId === S.activeWs) renderWPTabContent();
}

// ── TERMINAL ──────────────────────────────────────────────────────────────────
function tline(key, cls, text) {
  const el = document.getElementById(`tout-${key}`);
  if (!el) return;
  const p = document.createElement('p');
  p.className = 'term-line ' + cls;
  p.textContent = text;
  el.appendChild(p);
  el.scrollTop = el.scrollHeight;
}
function qcmd(key, cmd) {
  const inp = document.getElementById(`tinp-${key}`);
  if (inp) { inp.value = cmd; runTerm(key); }
}
async function runTerm(key) {
  const inp = document.getElementById(`tinp-${key}`);
  if (!inp) return;
  const cmd = inp.value.trim(); if (!cmd) return;
  S.termHistories[key] = S.termHistories[key] || [];
  S.termHistories[key].unshift(cmd);
  S.termHistIdx[key] = -1;
  inp.value = '';
  pushHistory(cmd);
  tline(key,'tl-cmd','$ '+cmd);
  tline(key,'tl-info','Running…');
  try {
    const r = await fetch(API+'/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:cmd})});
    const d = await r.json();
    const el = document.getElementById(`tout-${key}`);
    if (el?.lastChild?.classList.contains('tl-info')) el.removeChild(el.lastChild);
    if (d.output) tline(key,'tl-out',d.output);
    if (d.error)  tline(key,'tl-err','⚠ '+d.error);
    if (!d.online) tline(key,'tl-err','✗ Server offline');
  } catch {
    const el = document.getElementById(`tout-${key}`);
    if (el?.lastChild?.classList.contains('tl-info')) el.removeChild(el.lastChild);
    tline(key,'tl-err','✗ Hub server not running — start hub/server.py');
  }
}

// ── LOGS ──────────────────────────────────────────────────────────────────────
async function fetchLogs(key) {
  const name = document.getElementById(`lname-${key}`)?.value.trim();
  const lines = document.getElementById(`llines-${key}`)?.value || 80;
  if (!name) return;
  const out = document.getElementById(`lout-${key}`);
  out.textContent = `Fetching ${lines} lines from ${name}…`;
  try {
    const r = await fetch(API+'/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:`docker logs --tail ${lines} ${name} 2>&1`})});
    const d = await r.json();
    out.textContent = d.output || d.error || '(no output)';
    out.scrollTop = out.scrollHeight;
  } catch { out.textContent = 'Hub server not running.'; }
}

async function loadDocsPane(key, preselect) {
  if (!S.docsLoaded) { await fetchDocs(); }
  const sb = document.getElementById(`dsb-${key}`);
  if (!sb) return;
  if (!S.docs.length) { sb.innerHTML='<div style="padding:10px;color:var(--muted);font-size:11px">No guides found</div>'; return; }
  sb.innerHTML = S.docs.map(d=>
    `<div class="doc-item" onclick="openDocInPane('${key}','${d.file}',this)">${d.title}</div>`
  ).join('');
  const first = preselect ? S.docs.find(d=>d.file===preselect) : S.docs[0];
  if (first) { openDocInPane(key, first.file, sb.querySelector('.doc-item')); }
}
async function openDocInPane(key, file, el) {
  document.querySelectorAll(`#dsb-${key} .doc-item`).forEach(d=>d.classList.remove('active'));
  if (el) el.classList.add('active');
  const con = document.getElementById(`dcon-${key}`);
  if (!con) return;
  con.innerHTML = '<div style="color:var(--muted);padding:20px;font-size:12px">Loading…</div>';
  try {
    const r = await fetch(`${API}/api/docs/content?file=${encodeURIComponent(file)}`);
    const d = await r.json();
    con.innerHTML = renderMd(d.content||'');
  } catch { con.innerHTML = '<div style="color:var(--muted);padding:20px">Failed to load</div>'; }
}

function renderMd(text) {
  const esc = s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const blocks=[];
  text=text.replace(/```(\w*)\n([\s\S]*?)```/g,(_,l,c)=>{blocks.push(`<pre><code>${esc(c.trimEnd())}</code></pre>`);return`\x00B${blocks.length-1}\x00`;});
  text=text.replace(/`([^`]+)`/g,(_,c)=>`<code>${esc(c)}</code>`);
  text=text.replace(/\|(.+)\|\n\|[-| :]+\|\n((?:\|.+\|\n?)*)/g,(_,h,rows)=>{
    const th=h.split('|').filter(c=>c.trim()).map(c=>`<th>${c.trim()}</th>`).join('');
    const tr=rows.trim().split('\n').map(r=>`<tr>${r.split('|').filter(c=>c.trim()).map(c=>`<td>${c.trim()}</td>`).join('')}</tr>`).join('');
    return `<table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
  });
  text=text.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  text=text.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  text=text.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  text=text.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  text=text.replace(/\*(.+?)\*/g,'<em>$1</em>');
  text=text.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');
  text=text.replace(/(^[-*] .+$(\n^[-*] .+$)*)/gm,m=>`<ul>${m.split('\n').map(l=>`<li>${l.replace(/^[-*] /,'')}</li>`).join('')}</ul>`);
  text=text.replace(/^---$/gm,'<hr style="border-color:var(--border);margin:14px 0">');
  text=text.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  const lines=text.split('\n');const out=[];
  for(const l of lines){const t=l.trim();if(!t){out.push('');continue;}if(t.startsWith('<')||t.startsWith('\x00B')){out.push(t);continue;}out.push(`<p>${t}</p>`);}
  text=out.join('\n');
  blocks.forEach((b,i)=>{text=text.replace(`\x00B${i}\x00`,b);});
  return text;
}

// Per-runbook state: {stepIdx: {status:'', output:''}}
const RB_STATE = {};
let RB_ACTIVE = null;

function openRunbook(id) {
  RB_ACTIVE = id;
  document.querySelectorAll('.rb-card').forEach(el => el.classList.toggle('active', el.dataset.rb===id));
  const rb = RUNBOOKS.find(r=>r.id===id);
  const detail = document.querySelector('.rb-detail');
  if (!rb || !detail) return;
  if (!RB_STATE[id]) RB_STATE[id] = {};
  detail.innerHTML = `
    <div class="rb-detail-hdr">
      <span style="font-size:20px">${rb.icon}</span>
      <div>
        <div class="rb-detail-title">${rb.name}</div>
        <div class="rb-detail-desc">${rb.desc}</div>
      </div>
      <button class="btn p" style="margin-left:auto" onclick="runAllSteps('${id}')">▶ Run All</button>
      <button class="btn" onclick="resetRunbook('${id}')">↺ Reset</button>
    </div>
    <div class="rb-steps">
      ${rb.steps.map((s,i)=>`
        <div class="rb-step" id="rbstep-${id}-${i}">
          <div class="rb-step-hdr" onclick="toggleStepOut('${id}',${i})">
            <span class="rb-step-num">${String(i+1).padStart(2,'0')}</span>
            <span class="rb-step-name">${s.name}</span>
            <span class="rb-step-cmd">${s.cmd.slice(0,50)}${s.cmd.length>50?'…':''}</span>
            <span class="rb-step-icon" id="rbicon-${id}-${i}">⬜</span>
            <button class="rb-step-run" id="rbbtn-${id}-${i}" onclick="event.stopPropagation();runStep('${id}',${i})">Run</button>
          </div>
          <div class="rb-step-out" id="rbout-${id}-${i}"></div>
        </div>`).join('')}
    </div>`;
  // Restore previous state
  rb.steps.forEach((_,i) => {
    const st = RB_STATE[id][i];
    if (st) { setStepStatus(id,i,st.status); const o=document.getElementById(`rbout-${id}-${i}`); if(o&&st.output){o.textContent=st.output;o.classList.add('show');} }
  });
}

function toggleStepOut(rbId, i) {
  const el = document.getElementById(`rbout-${rbId}-${i}`);
  if (el) el.classList.toggle('show');
}

function setStepStatus(rbId, i, status) {
  const icon = document.getElementById(`rbicon-${rbId}-${i}`);
  const btn  = document.getElementById(`rbbtn-${rbId}-${i}`);
  const icons = {pending:'⬜', running:'🔄', ok:'✅', err:'❌'};
  if (icon) icon.textContent = icons[status] || '⬜';
  if (btn)  btn.disabled = status === 'running';
  if (!RB_STATE[rbId]) RB_STATE[rbId] = {};
  RB_STATE[rbId][i] = RB_STATE[rbId][i] || {};
  RB_STATE[rbId][i].status = status;
}

async function runStep(rbId, stepIdx) {
  const rb = RUNBOOKS.find(r=>r.id===rbId); if (!rb) return;
  const s = rb.steps[stepIdx]; if (!s) return;
  setStepStatus(rbId, stepIdx, 'running');
  const outEl = document.getElementById(`rbout-${rbId}-${stepIdx}`);
  if (outEl) { outEl.textContent = 'Running…'; outEl.classList.add('show'); }
  try {
    const r = await fetch(API+'/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:s.cmd,timeout:60})});
    const d = await r.json();
    const out = [d.output, d.error].filter(Boolean).join('\n') || '(no output)';
    if (outEl) outEl.textContent = out;
    if (!RB_STATE[rbId]) RB_STATE[rbId] = {};
    if (!RB_STATE[rbId][stepIdx]) RB_STATE[rbId][stepIdx] = {};
    RB_STATE[rbId][stepIdx].output = out;
    setStepStatus(rbId, stepIdx, d.exitcode===0||d.online ? 'ok' : 'err');
  } catch(e) {
    if (outEl) outEl.textContent = 'Hub server not running.';
    setStepStatus(rbId, stepIdx, 'err');
  }
}

async function runAllSteps(rbId) {
  const rb = RUNBOOKS.find(r=>r.id===rbId); if (!rb) return;
  for (let i=0; i<rb.steps.length; i++) {
    await runStep(rbId, i);
    await new Promise(res=>setTimeout(res,300));
  }
}

function resetRunbook(rbId) {
  RB_STATE[rbId] = {};
  if (RB_ACTIVE === rbId) openRunbook(rbId);
}

  body.innerHTML = `<div class="view-runbooks">
    <div class="rb-list">

        </div>`).join('')}
    </div>

function initVault(key) { /* vault uses global S.vaultData, nothing extra needed */ }
async function vaultUnlock() {
  const mp=document.getElementById('vmp')?.value; if(!mp) return;
  const err=document.getElementById('verr'); err.textContent='';
  try {
    const r=await fetch(API+'/api/vault'); const d=await r.json();
    if(!d.blob){err.textContent='No vault found. Click "New Vault".';return;}
    S.vaultData=await vDec(d.blob,mp); S.vaultMP=mp;
    document.querySelectorAll('.view-vault').forEach(el=>{el.innerHTML=vaultBodyHTML();});
  } catch { if(err) err.textContent='Wrong password or vault corrupted.'; }
}
async function vaultSetup() {
  const mp=document.getElementById('vmp')?.value;
  if(!mp||mp.length<6){const err=document.getElementById('verr');if(err)err.textContent='Password must be 6+ characters.';return;}
  S.vaultData={entries:[]}; S.vaultMP=mp; await saveVault();
  document.querySelectorAll('.view-vault').forEach(el=>{el.innerHTML=vaultBodyHTML();});
}
function vaultLock() { S.vaultData=null; S.vaultMP=null; document.querySelectorAll('.view-vault').forEach(el=>{el.innerHTML=vaultHTML();}); }
async function saveVault() {
  const blob=await vEnc(S.vaultData,S.vaultMP);
  try { await fetch(API+'/api/vault',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({blob})}); }
  catch { localStorage.setItem('vault_backup',blob); }
}
function toggleVPw(i) { const el=document.getElementById('vepw-'+i); const s=el.classList.toggle('show'); el.textContent=s?(S.vaultData.entries[i].password||'—'):'••••••••'; }
async function delVE(i) { if(!confirm('Delete?'))return; S.vaultData.entries.splice(i,1); await saveVault(); document.querySelectorAll('.view-vault').forEach(el=>{el.innerHTML=vaultBodyHTML();}); }
function vaultAdd() { const t=prompt('Title:');if(!t)return;const u=prompt('Username:')||'';const p=prompt('Password:')||'';const url=prompt('URL (optional):')||'';S.vaultData.entries.push({title:t,username:u,password:p,url});saveVault();document.querySelectorAll('.view-vault').forEach(el=>{el.innerHTML=vaultBodyHTML();}); }
async function vEnc(data,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const k=await vKey(pw,salt);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(data)));const o=new Uint8Array(28+ct.byteLength);o.set(salt,0);o.set(iv,16);o.set(new Uint8Array(ct),28);return btoa(String.fromCharCode(...o));}
async function vDec(blob,pw){const r=Uint8Array.from(atob(blob),c=>c.charCodeAt(0));const k=await vKey(pw,r.slice(0,16));const d=await crypto.subtle.decrypt({name:'AES-GCM',iv:r.slice(16,28)},k,r.slice(28));return JSON.parse(new TextDecoder().decode(d));}
async function vKey(pw,salt){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}

let bookmarks = JSON.parse(localStorage.getItem('hub_bookmarks')||'[]');

function renderBookmarks() {
  const bar = document.getElementById('bkbar');
  const add = bar.querySelector('.bk-add');
  bar.querySelectorAll('.bk-chip').forEach(el => el.remove());
  bookmarks.forEach((bk, i) => {
    const chip = document.createElement('div');
    chip.className = 'bk-chip';
    chip.innerHTML = `${bk.icon} ${bk.label}<span class="bk-chip-x" onclick="event.stopPropagation();removeBookmark(${i})">✕</span>`;
    chip.addEventListener('click', () => runBookmark(bk));
    bar.insertBefore(chip, add);
  });
}

function runBookmark(bk) {
  if (!bk) return;
  if (typeof bk === 'string') try { bk = JSON.parse(bk); } catch { return; }
  if (bk.type === 'view') openView(bk.viewType);
  else if (bk.type === 'iframe') openIframeWs(bk.label, bk.port, bk.url);
  else if (bk.type === 'doc') openDocWs(bk.file, bk.label);
}

function addBookmark(icon, label, type, extra={}) {
  if (!label) {
    label = prompt('Bookmark name:'); if (!label) return;
    icon = prompt('Icon (emoji):', '⭐') || '⭐';
    type = 'view';
    const vt = prompt('View type (dashboard/terminal/logs/map/vault/issues/network/chat):', 'dashboard') || 'dashboard';
    extra = {viewType: vt};
  }
  bookmarks.push({icon, label, type, ...extra});
  localStorage.setItem('hub_bookmarks', JSON.stringify(bookmarks));
  renderBookmarks();
}

function addBookmarkFrom(icon, label, type, extra) {
  if (bookmarks.find(b=>b.label===label)) return;
  bookmarks.push({icon, label, type, ...extra});
  localStorage.setItem('hub_bookmarks', JSON.stringify(bookmarks));
  renderBookmarks();
}

function removeBookmark(i) {
  bookmarks.splice(i, 1);
  localStorage.setItem('hub_bookmarks', JSON.stringify(bookmarks));
  renderBookmarks();
  refreshCategoryNav();
}

function isFav(label) { return bookmarks.some(b => b.label === label); }

function toggleFav(icon, label, type, extraJson) {
  const extra = extraJson ? JSON.parse(extraJson) : {};
  const idx = bookmarks.findIndex(b => b.label === label);
  if (idx >= 0) { bookmarks.splice(idx, 1); }
  else { bookmarks.push({icon, label, type, ...extra}); }
  localStorage.setItem('hub_bookmarks', JSON.stringify(bookmarks));
  renderBookmarks();
  refreshCategoryNav();
}

const S_HISTORY = []; // session command history (all terminals)
let wpTab = 'ctx';

function setWPTab(tab) {
  wpTab = tab;
  document.querySelectorAll('.wp-tab').forEach(el => el.classList.toggle('active', el.dataset.tab===tab));
  renderWPTabContent();

function renderWPTabContent() {
  if (wpTab === 'ctx') updateContextPanel();
  else if (wpTab === 'alerts') renderAlertsTab();
  else if (wpTab === 'hist') renderHistoryTab();
}

function renderAlertsTab() {
  const body = document.getElementById('ctx-panel-content'); if (!body) return;
  const alerts = [];
  if (!S.status?.online) {
    alerts.push({level:'crit', msg:'Server offline or unreachable'});
  } else {
    const diskPct = parseInt(S.status.disk_pct);
    if (diskPct > 90) alerts.push({level:'crit', msg:`Disk critical: ${S.status.disk_pct} used`});
    else if (diskPct > 75) alerts.push({level:'warn', msg:`Disk at ${S.status.disk_pct} — consider pruning`});
    const load = parseFloat(S.status.load?.split(' ')[0]);
    if (load > 8) alerts.push({level:'warn', msg:`High load average: ${S.status.load}`});
  }
  const stopped = S.containers.filter(c=>!c.running);
  if (stopped.length) alerts.push({level:'warn', msg:`${stopped.length} container${stopped.length>1?'s':''} stopped`, detail: stopped.map(c=>c.name).join(', ')});
  const clr = l => l==='crit'?'var(--red)':l==='warn'?'var(--yellow)':'var(--green)';
  if (!alerts.length) {
    body.innerHTML = `<div style="padding:24px 8px;text-align:center"><div style="font-size:24px;margin-bottom:6px">✓</div><div style="font-size:11px;color:var(--green)">All systems clear</div></div>`;
    return;
  }
  body.innerHTML = alerts.map(a => `
    <div style="border-left:3px solid ${clr(a.level)};padding:6px 10px;margin:6px 0;background:rgba(0,0,0,.2);border-radius:0 4px 4px 0">
      <div style="font-size:11px;color:var(--text);font-weight:600">${a.msg}</div>
      ${a.detail?`<div style="font-size:10px;color:var(--muted);margin-top:2px;font-family:var(--mono)">${a.detail}</div>`:''}
    </div>`).join('');
}

function renderHistoryTab() {
  const body = document.getElementById('ctx-panel-content'); if (!body) return;
  if (!S_HISTORY.length) {
    body.innerHTML = `<div style="padding:12px 8px;font-size:11px;color:var(--muted)">No commands run this session</div>`;
    return;
  }
  const secHead = t => `<div style="font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted2);padding:8px 8px 5px">${t}</div>`;
  body.innerHTML = secHead('Recent Commands') +
    [...S_HISTORY].slice(0,30).map(h =>

function setWsLayout(wsId, layout) {
  const ws = S.workspaces.find(w=>w.id===wsId); if (!ws) return;
  const counts = {l1:1,l2h:2,l2v:2,l4:4};
  const need = counts[layout]||1;
  while (ws.panes.length < need) ws.panes.push({id:uid(),viewType:'blank',viewConfig:{}});
  ws.panes = ws.panes.slice(0, need);
  ws.layout = layout;
  reRenderWorkspace(wsId);
}

function saveStickyNotes() {
  const data = W.widgets.filter(w=>w.type==='sticky').map(w => {

  });
  localStorage.setItem('hub_stickies', JSON.stringify(data));
}

  try {
    const saved = JSON.parse(localStorage.getItem('hub_stickies')||'[]');
    const def = WIDGET_DEFS.sticky;
    saved.forEach(s => {
      const id = wuid();
      const layer = document.getElementById('widget-layer');
      W.zTop++;
      const el = document.createElement('div');
      el.className = 'widget'; el.dataset.wid = id;
      el.style.cssText = `left:${s.x}px;top:${s.y}px;width:${s.w||def.w}px;height:${s.h||def.h}px;z-index:${W.zTop}`;
